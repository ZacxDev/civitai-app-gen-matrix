# pnpm's default minimumReleaseAge gate would refuse to install very fresh
# package versions. The pinned Civitai SDK + design-system packages are trusted,
# so exclude them from that gate.
#
# These versions carry what the production-hardened block (v0.8.0) relies on:
#   - @civitai/blocks-react@0.37.0 — `useResourcePicker()` (native Checkpoint |
#     LORA picker), the shared `/testing` mock host (`createMockHost` /
#     `<Harness>`) now seeded with the appWorkflows + storage read-model,
#     `useDomainMaturity()`/`<SfwGate>` (domain maturity ceiling, BLOCK_INIT),
#     and — new — `useAppWorkflows()` + `useAppStorage()` (the persistence
#     read-model behind M1/M2/G1) plus `BlockGate`/`injectBlocksStyles` under
#     the `/ui` subpath.
#   - @civitai/app-sdk@0.28.0 — the block message/type contract incl.
#     `BlockResourceInfo` names, the `ColorDomain`/maturity projection, and the
#     `AppWorkflow` read-model shape (`images[].nsfwLevel` — the G1 gate source).
#   - @civitai/theme@0.2.0 — the `--civitai-*` design tokens (theme.ts).
#     (NOTE: 0.3.0 is NOT published; 0.2.0 is the latest — do not bump blindly.)
#   - @civitai/components@0.3.0 + @civitai/components-react@0.3.0 — the
#     attribute-driven CSS + React primitives (Slider/Image/Tooltip/Toast/
#     SegmentedControl) the UI adopts.
#   - @civitai/sdk@0.8.0 — the successor package this block's runtime bindings
#     now sit on (`initialize({ transport })` → `app.site`/`storage`/
#     `sharedStorage` + `createHost`). See `src/lib/sdk-runtime.ts`.
#     🔴 PUBLISHED 2026-09-27T02:04:53.050Z (`npm view @civitai/sdk time --json`).
#     This entry is INERT 24h after that instant — delete it then rather than
#     leaving a permanent exemption. The version is EXACT on purpose: a bare
#     `@civitai/sdk` would exempt every future release, including one cut by a
#     compromised publish token, which is the whole thing the gate is for.
# All resolve from the npm registry directly — no local `link:`/`overrides`.
#
# ⚠ MEASURED, AND IT CORRECTS THE FIRST SENTENCE OF THIS FILE: there is no "default
# minimumReleaseAge gate" in effect here. `minimumReleaseAge` is NOT configured —
# `pnpm config get minimumReleaseAge` answers `undefined` — and `minimumReleaseAgeExclude`
# alone does nothing, so every entry in the list below is currently INERT. Checked at
# four points, all of which install a same-day package clean with NO exclude entry:
# pnpm 10.28.1 and pnpm 11.28.0, each with `--frozen-lockfile` and with a fresh
# resolution (`--lockfile-only`, lockfile deleted). The mechanism does work — adding
# `minimumReleaseAge: 10080` makes pnpm 11 refuse with
# `ERR_PNPM_NO_MATURE_MATCHING_VERSION`, which is how the list above was confirmed to
# be about a real thing rather than a cargo-culted key.
#
# So keep maintaining this list — it is the repo's convention, it is what makes
# turning the gate ON a one-line change, and each entry records WHEN a version was
# published. Just do not believe a green `pnpm install` proves an entry was needed.
#
# Single-package repo: declare the root explicitly so pnpm and setup-node's
# `cache: pnpm` don't error "packages field missing or empty". The deployed
# 0.8.x bundle dropped this line; CI only exists in this repo (.github/ is not
# part of the submitted bundle), so nothing upstream could have caught it.
packages:
  - '.'
minimumReleaseAgeExclude:
  - '@civitai/app-sdk@0.28.0'
  - '@civitai/blocks-react@0.37.0 || 0.46.0 || 0.47.0'
  - '@civitai/theme@0.2.0 || 0.3.1'
  - '@civitai/components@0.3.0 || 0.4.1'
  - '@civitai/components-react@0.3.0 || 0.4.1'
  - '@civitai/sdk@0.8.0'
