# pnpm's default minimumReleaseAge gate would refuse to install very fresh
# package versions. The pinned Civitai SDK + design-system packages are trusted,
# so exclude them from that gate.
#
# These versions carry what the production-hardened block (v0.8.0) relies on:
#   - @civitai/blocks-react@0.37.0 — `useResourcePicker()` (native Checkpoint |
#     LORA picker), the shared `/testing` mock host (`createMockHost` /
#     `<Harness>`) now seeded with the appWorkflows + storage read-model,
#     `useDomainMaturity()`/`<SfwGate>` (domain maturity ceiling, BLOCK_INIT),
#     and — new — `useAppWorkflows()` + `useAppStorage()` (the persistence
#     read-model behind M1/M2/G1) plus `BlockGate`/`injectBlocksStyles` under
#     the `/ui` subpath.
#   - @civitai/app-sdk@0.28.0 — the block message/type contract incl.
#     `BlockResourceInfo` names, the `ColorDomain`/maturity projection, and the
#     `AppWorkflow` read-model shape (`images[].nsfwLevel` — the G1 gate source).
#   - @civitai/theme@0.2.0 — the `--civitai-*` design tokens (theme.ts).
#     (NOTE: 0.3.0 is NOT published; 0.2.0 is the latest — do not bump blindly.)
#   - @civitai/components@0.3.0 + @civitai/components-react@0.3.0 — the
#     attribute-driven CSS + React primitives (Slider/Image/Tooltip/Toast/
#     SegmentedControl) the UI adopts.
#   - @civitai/sdk@0.8.0 — the successor package this block's runtime bindings
#     now sit on (`initialize({ transport })` → `app.site`/`storage`/
#     `sharedStorage` + `createHost`). See `src/lib/sdk-runtime.ts`.
#     🔴 PUBLISHED 2026-09-27T02:04:53.050Z (`npm view @civitai/sdk time --json`).
#     This entry is INERT 24h after that instant — delete it then rather than
#     leaving a permanent exemption. The version is EXACT on purpose: a bare
#     `@civitai/sdk` would exempt every future release, including one cut by a
#     compromised publish token, which is the whole thing the gate is for.
# All resolve from the npm registry directly — no local `link:`/`overrides`.
#
# 🔴 THIS LIST IS LIVE AND ITS ENTRIES ARE MANDATORY. A previous version of this
# block asserted the opposite — "every entry in the list below is currently INERT"
# — and that was WRONG in the expensive direction: it reads as permission to skip
# the entry on a bump, and skipping it fails CI outright. Retracted 2026-10-02 by
# a measurement WITH A CONTROL, on the toolchain this repo actually pins.
#
# WHY THE OLD CLAIM LOOKED TRUE, and it is the reusable lesson: `pnpm config get
# minimumReleaseAge` answers `undefined`, and `undefined` DOES NOT MEAN OFF — pnpm
# 11.25.0 applies a BUILT-IN 24-HOUR DEFAULT. So the one command anyone reaches for
# to check reports the gate absent while it is enforcing. The old block also states
# its own scope: it checked pnpm 10.28.1 and 11.28.0 — NEITHER of which is the
# 11.25.0 that `flake.nix` pins — so its conclusion never covered this repo's own
# toolchain. A version-dependent claim measured at two points that exclude the one
# in use is how a false "inert" survives review.
#
# THE CONTROL (2026-10-02T04:55Z, pnpm 11.25.0, `rm -rf node_modules` first).
# Removing ONLY the `0.62.0` token from the blocks-react line below:
#
#   $ pnpm install --frozen-lockfile          # rc=1
#   [ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION] 1 lockfile entries failed verification:
#     @civitai/blocks-react@0.62.0 was published at 2026-10-02T04:00:25.000Z,
#     within the minimumReleaseAge cutoff (2026-10-01T04:55:23.576Z)
#
# Putting the token back: rc=0, `Done in 3.5s`. The cutoff is exactly now-24h, so
# the gate expires per-version on a clock rather than on a config change.
#
# CI runs `pnpm install --frozen-lockfile` (`.github/workflows/ci.yml`), so an
# omitted entry is not a style nit — it is a red build until the version ages out.
#
# WHICH MEANS: add the version you are bumping TO, and record its publish instant
# so a later prune is mechanical rather than a guess. An entry is dead once the
# version is >24h old AND `package.json` no longer resolves to it; the stale tokens
# still listed below are exemptions for versions this repo can no longer install,
# and pruning them is a tidy-up this bump deliberately does not fold in.
#   - @civitai/blocks-react@0.62.0 — PUBLISHED 2026-10-02T04:02:03.809Z (npm view
#     @civitai/blocks-react time --json). Required until ~2026-10-03T04:02Z.
#   - @civitai/app-sdk@0.54.0 — PUBLISHED 2026-10-01T02:52:24.760Z, i.e. already
#     older than 24h at that bump, MEASURED to install clean with NO entry (rc=0).
#     Deliberately NOT added: an unneeded token here is a permanent exemption for a
#     version that does not need one, which is the thing this file warns against.
#
# THE 0.63.0 BUMP (2026-10-02T19:06Z). Four tokens were added, and EACH ONE WAS
# CONTROLLED — removed on its own, `rm -rf node_modules`, `pnpm install
# --frozen-lockfile`, and the resulting rc recorded. All four are MANDATORY:
#   - @civitai/blocks-react@0.63.0 — PUBLISHED 2026-10-02T17:42:54.561Z. Required
#     until ~2026-10-03T17:43Z. Control: rc=1, "1 lockfile entries failed
#     verification: @civitai/blocks-react@0.63.0 was published at
#     2026-10-02T17:38:43.000Z, within the minimumReleaseAge cutoff".
#   - @civitai/app-sdk@0.55.0 — PUBLISHED 2026-10-02T17:41:53.057Z. Required until
#     ~2026-10-03T17:42Z. NOT optional the way 0.54.0 was: blocks-react@0.63.0
#     declares `peerDependencies: {"@civitai/app-sdk": ">=0.55.0 <1.0.0"}`, and a
#     pre-1.0 caret locks the MINOR, so `^0.54.0` = `>=0.54.0 <0.55.0` EXCLUDES
#     0.55.0. Control: rc=1 on @civitai/app-sdk@0.55.0.
#   - @civitai/theme@0.5.0 and @civitai/components@0.9.1 — PUBLISHED
#     2026-10-02T17:38:43.000Z. 🔴 TRANSITIVE, NOT DIRECT: this package.json still
#     pins theme ^0.3.1 / components ^0.4.1; these two versions enter the lockfile
#     only as blocks-react@0.63.0's own nested deps, and pnpm APPENDED both tokens
#     for us during `pnpm install`. The lesson: the release-age gate scores every
#     LOCKFILE entry, not just the ranges you edited, so a bump can require
#     exemptions for packages you never touched. Control: rc=1, "2 lockfile
#     entries failed verification" naming both.
#
# Single-package repo: declare the root explicitly so pnpm and setup-node's
# `cache: pnpm` don't error "packages field missing or empty". The deployed
# 0.8.x bundle dropped this line; CI only exists in this repo (.github/ is not
# part of the submitted bundle), so nothing upstream could have caught it.
packages:
  - '.'
minimumReleaseAgeExclude:
  - '@civitai/app-sdk@0.28.0 || 0.55.0'
  - '@civitai/blocks-react@0.37.0 || 0.46.0 || 0.47.0 || 0.62.0 || 0.63.0'
  - '@civitai/theme@0.2.0 || 0.3.1 || 0.5.0'
  - '@civitai/components@0.3.0 || 0.4.1 || 0.9.1'
  - '@civitai/components-react@0.3.0 || 0.4.1'
  - '@civitai/sdk@0.8.0'
